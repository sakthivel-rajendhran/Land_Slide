# ========================================================
# SlopeGuard Backend Configuration (Phase 9: Production-Structured MySQL Persistence)
# ========================================================

# Application Name
spring.application.name=slopeguard-backend

# Server Port (Change here if port 8080 is in use, e.g. server.port=8081)
server.port=${PORT:8080}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration for SlopeGuard Frontend
# Configurable allowed origins (comma-separated).
slopeguard.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080}

# ========================================================
# Database & Persistence Configuration (MySQL 8.x)
# ========================================================
spring.datasource.url=${SLOPEGUARD_DB_URL:jdbc:mysql://localhost:3306/slopeguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SLOPEGUARD_DB_USERNAME:root}
spring.datasource.password=${SLOPEGUARD_DB_PASSWORD:ragul@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=SlopeGuardHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings (Strict Schema Validation via Flyway)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ========================================================
# JWT Authentication & Authorization Configuration
# ========================================================
# JWT Signing Secret (must be at least 256 bits / 32 characters for HS256 compliance).
# In production, set this via the JWT_SECRET environment variable.
slopeguard.security.jwt.secret=${JWT_SECRET:slopeguard_dev_secure_jwt_signing_key_phase2_northeast_2026_minimum_32_bytes}
slopeguard.security.jwt.issuer=${JWT_ISSUER:slopeguard-backend}
# Access token expiration in seconds (default: 900 seconds = 15 minutes)
slopeguard.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# ========================================================
# Development Administrative Account Provisioning (Controlled)
# Disabled by default; configure environment variables to enable in development
# ========================================================
slopeguard.security.admin.enabled=${ADMIN_ENABLED:true}
slopeguard.security.admin.email=${ADMIN_EMAIL:admin@slopeguard.org}
slopeguard.security.admin.password=${ADMIN_PASSWORD:AdminPass123!Safe}
slopeguard.security.admin.name=${ADMIN_NAME:System Administrator}

# ========================================================
# Photograph & Media Upload Configuration
# ========================================================
# Directory path for storing uploaded photographs (outside source code)
slopeguard.upload.dir=${UPLOAD_DIR:./data/uploads}
# Maximum allowed file size per photograph in bytes (default: 5MB = 5242880)
slopeguard.upload.max-file-size=${MAX_FILE_SIZE:5242880}
# Maximum number of photographs allowed per incident report
slopeguard.upload.max-photos-per-report=${MAX_PHOTOS_PER_REPORT:5}

# Spring Servlet Multipart Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.slopeguard=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO

# ========================================================
# Open-Meteo Environmental Rainfall Provider Configuration
# ========================================================
slopeguard.environmental.open-meteo.enabled=${OPEN_METEO_ENABLED:true}
slopeguard.environmental.open-meteo.base-url=${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
slopeguard.environmental.open-meteo.connect-timeout-seconds=${OPEN_METEO_CONNECT_TIMEOUT:5}
slopeguard.environmental.open-meteo.read-timeout-seconds=${OPEN_METEO_READ_TIMEOUT:5}
slopeguard.environmental.open-meteo.cache-ttl-minutes=${OPEN_METEO_CACHE_TTL_MINUTES:15}

# ========================================================
# SlopeGuard Python AI-Service Client Configuration (Phase 6)
# ========================================================
slopeguard.ai-service.enabled=${AI_SERVICE_ENABLED:true}
slopeguard.ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
slopeguard.ai-service.connect-timeout-seconds=${AI_SERVICE_CONNECT_TIMEOUT:5}
slopeguard.ai-service.read-timeout-seconds=${AI_SERVICE_READ_TIMEOUT:5}

# ========================================================
# Digital Elevation Model (DEM) & Terrain Feature Provider (Phase 8)
# ========================================================
slopeguard.environmental.dem.enabled=${DEM_ENABLED:true}
slopeguard.environmental.dem.provider-name=${DEM_PROVIDER:Copernicus DEM (ESA)}
slopeguard.environmental.dem.product-name=${DEM_PRODUCT:GLO-30 Public Copernicus DSM}
slopeguard.environmental.dem.resolution=${DEM_RESOLUTION:1 arc-second (~30m)}
slopeguard.environmental.dem.crs=${DEM_CRS:EPSG:4326 (WGS 84)}
slopeguard.environmental.dem.local-raster-path=${DEM_LOCAL_RASTER_PATH:classpath:dem/copernicus_dem_glo30_shillong.asc}
slopeguard.environmental.dem.cache-ttl-minutes=${DEM_CACHE_TTL_MINUTES:60}
slopeguard.environmental.dem.cache-max-entries=${DEM_CACHE_MAX_ENTRIES:1000}
